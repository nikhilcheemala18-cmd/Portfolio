<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Travel Booking Agent architecture</title>
  <desc id="desc">Agentic travel planning architecture with chat frontend, FastAPI, conversation manager, planner, tool executor, validator, fallback manager, itinerary builder, and response builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050707"/><stop offset="1" stop-color="#071611"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#12211b"/><stop offset="1" stop-color="#07100d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".4"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M2 2l9 5-9 5z" fill="#34d399"/></marker>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1090" cy="150" r="290" fill="#34d399" opacity=".08"/>
  <circle cx="260" cy="720" r="300" fill="#38bdf8" opacity=".055"/>
  <text x="80" y="92" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">AI Travel Booking Agent</text>
  <text x="80" y="128" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">Conversational planning pipeline with tools, validation, fallbacks, and itinerary generation</text>
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#e8fff4" filter="url(#shadow)">
    <rect x="80" y="252" width="200" height="82" rx="18" fill="url(#card)" stroke="#14532d"/><text x="124" y="302">React Chat UI</text>
    <rect x="360" y="252" width="200" height="82" rx="18" fill="url(#card)" stroke="#14532d"/><text x="420" y="302">FastAPI</text>
    <rect x="640" y="252" width="220" height="82" rx="18" fill="url(#card)" stroke="#14532d"/><text x="674" y="302">Conversation Manager</text>
    <rect x="960" y="252" width="200" height="82" rx="18" fill="url(#card)" stroke="#14532d"/><text x="1020" y="302">Planner</text>
    <rect x="1120" y="420" width="220" height="82" rx="18" fill="url(#card)" stroke="#14532d"/><text x="1168" y="470">LLM Provider</text>
    <rect x="820" y="420" width="220" height="82" rx="18" fill="url(#card)" stroke="#14532d"/><text x="858" y="470">Tool Executor</text>
    <rect x="520" y="420" width="220" height="82" rx="18" fill="url(#card)" stroke="#14532d"/><text x="575" y="470">Validator</text>
    <rect x="220" y="420" width="220" height="82" rx="18" fill="url(#card)" stroke="#14532d"/><text x="260" y="470">Fallback Manager</text>
    <rect x="418" y="610" width="260" height="92" rx="20" fill="url(#card)" stroke="#10b981"/><text x="478" y="665">Itinerary Builder</text>
    <rect x="762" y="610" width="260" height="92" rx="20" fill="url(#card)" stroke="#10b981"/><text x="820" y="665">Response Builder</text>
  </g>
  <g stroke="#34d399" stroke-width="3" fill="none" opacity=".82" marker-end="url(#arrow)">
    <path d="M280 293h72"/><path d="M560 293h72"/><path d="M860 293h92"/><path d="M1060 334c40 64 75 75 83 82"/><path d="M1028 334c-14 54-47 70-85 82"/><path d="M820 461h-72"/><path d="M520 461h-72"/><path d="M330 502c26 90 112 116 200 108"/><path d="M678 656h74"/>
  </g>
  <g fill="#93f5c8" font-family="Inter, Arial, sans-serif" font-size="15" opacity=".78">
    <text x="102" y="360">Natural-language trip request</text>
    <text x="378" y="360">API envelope + session id</text>
    <text x="648" y="360">Slots, corrections, memory</text>
    <text x="981" y="360">Plan next action</text>
    <text x="852" y="528">Flights · Hotels · Tools</text>
    <text x="237" y="528">Bounded retries</text>
  </g>
</svg>
